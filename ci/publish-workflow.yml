name: Publish to PyPI

# IMPORTANT: GitHub requires the `workflow` scope on a PAT to create
# .github/workflows/*.yml files directly. This template lives at
# /ci/publish-workflow.yml because the deploy PAT used to push to
# lordxmen2k/KeystoneCrypto doesn't have that scope.
#
# To enable automated tag-based publishing on your local clone:
#   1. mkdir -p .github/workflows
#   2. cp ci/publish-workflow.yml .github/workflows/publish.yml
#   3. Configure trusted publishing once on PyPI:
#      https://pypi.org/manage/project/keystonecrypto/settings/publishing/
#      Add GitHub as a trusted publisher pointing to:
#        owner: lordxmen2k
#        repo: KeystoneCrypto
#        workflow: publish.yml
#   4. After the FIRST manual `twine upload`, every `git tag vX.Y.Z &&
#      git push origin vX.Y.Z` will trigger automated publishing via OIDC.
#      No API token in repo secrets needed.

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -v --cov=keystonecrypto

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build
      - name: Build
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
